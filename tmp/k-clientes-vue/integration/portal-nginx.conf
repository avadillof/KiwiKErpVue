# Dentro del server del portal, después de desplegar compose.portal.yaml.
# El portal accede únicamente al frontend de K_CLIENTES.
location = /gestion-clientes {
    return 302 /gestion-clientes/;
}
location /gestion-clientes/ {
    resolver 127.0.0.11 valid=30s;
    set $clientes_frontend kiwikerp-clientes:80;
    rewrite ^/gestion-clientes/(.*)$ /$1 break;
    proxy_pass http://$clientes_frontend;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    client_max_body_size 32k;
    add_header Cache-Control "no-store" always;
}
