server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El HTML contiene los nombres de los bundles de la versión publicada.
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Sólo los recursos con hash pueden conservarse sin revalidación.
    location ~* ^/assets/.+-[a-z0-9_-]{8,}\.(js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|webp|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Logos y otros archivos sin versión deben revalidarse.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
