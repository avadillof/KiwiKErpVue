server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # El HTML contiene los nombres de los bundles publicados.
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # Solo los recursos con hash pueden conservarse sin revalidación.
    location ~* "^/assets/.+-[a-z0-9_-]{8,}\.(js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|webp|ico)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Las peticiones API mal encaminadas nunca deben recibir el HTML de Vue.
    location /api/ {
        return 404;
    }

    # Los archivos inexistentes deben seguir devolviendo 404.
    location ~* \.(js|css|map|png|jpe?g|gif|svg|webp|ico|woff2?|ttf|pdf)$ {
        try_files $uri =404;
    }

    # Vue Router resuelve las rutas al entrar directamente o recargar.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
